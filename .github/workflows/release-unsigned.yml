name: Release (unsigned, fork)

# 上游 Release 工作流依赖仓库级 Tauri/Apple 签名密钥。本 fork 未配置这些 secrets，
# 用这个仅手动触发的工作流构建 Windows/Linux/macOS 安装包并发布 GitHub 正式 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v4.0.5
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-unsigned-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            bundles: msi
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - name: macOS Universal
            os: macos-14
            bundles: dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_target: universal-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev
          sudo apt-get install -y --no-install-recommends \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Tauri bundles
        if: runner.os != 'macOS'
        shell: bash
        run: |
          pnpm tauri build --bundles "${{ matrix.bundles }}" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build unsigned macOS universal DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pnpm tauri build --target "${{ matrix.tauri_target }}" --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem src-tauri\target\release\bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination release-assets

      - name: Collect Linux assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;

      - name: Collect macOS assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' \
            -exec cp {} release-assets/ \;

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-assets-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: unsigned-release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: CC Switch ${{ inputs.tag }}
          prerelease: false
          body: |
            ## CC Switch ${{ inputs.tag }}

            本 Release 由 fork 的 GitHub Actions 构建。由于仓库未配置代码签名和 Apple 公证 secrets，
            这些安装包未签名；安装时系统可能显示安全提示。

            ### Downloads
            Windows MSI、Linux AppImage / deb / rpm 和 macOS Universal DMG 见下方 Assets。
            macOS 包为未签名/ad-hoc 构建，首次打开可能需要右键选择“打开”。
          files: release-assets/*
